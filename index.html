<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="theme-color" content="#20C866">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Preço Certo">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./launchericon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./launchericon-512x512.png">
<link rel="apple-touch-icon" href="./launchericon-192x192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Preço Certo</title>
<style>
:root{--green:#20e36b;--green2:#0fa653;--light:#103b23;--red:#ff5b61;--text:#f5f7f6;--muted:#98a39d;--card:#151a17;--bg:#080c0a;--border:#26302b;--soft:#101612}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.app{max-width:480px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% -10%,#173a25 0,#0b100d 32%,#080c0a 70%);padding-bottom:82px}
header{padding:18px 18px 14px;background:rgba(9,13,11,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#22e36b,#0d9f50);display:grid;place-items:center;color:white;box-shadow:0 7px 22px #20e36b33;position:relative;overflow:hidden}.logo:before{content:'▥';font-size:25px;font-weight:900;transform:scaleX(1.15)}.logo:after{content:'⌕';position:absolute;font-size:21px;right:5px;bottom:0;font-weight:900}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:16px}.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#19b85b,#08763b);color:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 8px 24px #16a34a22}
.hero .label{font-size:13px;opacity:.9}.hero .total{font-size:30px;font-weight:800;margin:5px 0}
select,input,button{font:inherit}select,input{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:#101512;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:11px}.card h3{margin:0 0 5px;font-size:15px}.muted{color:var(--muted);font-size:12px}
.store{display:flex;align-items:center;gap:12px;cursor:pointer}.storeIcon{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#123d25,#0d2618);display:grid;place-items:center;font-size:21px;border:1px solid #1d5a36}.storeInfo{flex:1}.storeName{font-weight:700}.arrow{font-size:20px;color:#9ca3af}
button{border:0;border-radius:11px;padding:12px 14px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,#22e36b,#0fb454);color:#06120a;width:100%;box-shadow:0 7px 18px #20e36b25}.secondary{background:#15301f;color:#6ee7a0}.danger{background:#fee2e2;color:#b91c1c}.small{padding:8px 10px;font-size:12px}
.row{display:flex;gap:9px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.mt{margin-top:12px}
.product{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #29322d}.product:last-child{border-bottom:0}.check{width:22px;height:22px;accent-color:var(--green)}.pinfo{flex:1}.pname{font-weight:700;font-size:14px}.price{font-weight:800}.up{color:var(--red);font-size:11px}.down{color:var(--green);font-size:11px}.same{color:#777;font-size:11px}
.tabs{display:flex;gap:5px;background:#151b17;padding:4px;border-radius:12px;margin-bottom:12px}.tab{flex:1;background:transparent;padding:9px;font-size:12px}.tab.active{background:#222a25;color:var(--green);box-shadow:0 1px 5px #00000012}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:#101512;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:10}.nav{background:none;color:#66706a;font-size:11px;padding:5px}.nav.active{color:var(--green);font-weight:800}.scanBtn{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#22e36b,#0fa653);color:#06120a;font-size:23px;margin-top:-25px;box-shadow:0 5px 15px #16a34a44}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(480px,100%);margin:auto;background:#101512;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px}
.camera{height:280px;background:#050806;border-radius:18px;display:grid;place-items:center;color:white;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;width:72%;height:80px;border:3px solid #22c55e;border-radius:10px;z-index:2}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.selectedBox{margin-top:14px;padding:13px;border:1px solid #31513b;border-radius:13px;background:#102016}.selectedBox strong{font-size:18px}
</style>

<style id="themeOverrides">
:root{
  --accent:#20e36b;
  --accent2:#0fa653;
}
.logo,.primary,.scanBtn{background:linear-gradient(145deg,var(--accent),var(--accent2))!important}
.hero{background:linear-gradient(145deg,var(--accent2),var(--accent))!important}
.check{accent-color:var(--accent)!important}
.tab.active,.nav.active{color:var(--accent)!important}
.storeIcon{border-color:color-mix(in srgb,var(--accent) 35%,#1d5a36)!important}
.settingsBtn{margin-left:auto;width:42px;height:42px;border-radius:12px;background:#16221b;color:var(--accent);padding:0;font-size:20px}
.iconBtn{width:38px;height:38px;padding:0;border-radius:10px;background:#241515;color:#ff7070;font-size:17px;flex:0 0 auto}
.colorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.colorChoice{height:56px;border:2px solid #ffffff20;border-radius:14px;color:white;font-size:13px}
.scanFound{border:1px solid #2b5d3a;background:#0d1911;border-radius:14px;padding:14px;margin-top:12px}
.offlinePill{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:#8ef0ac;background:#102118;border:1px solid #234b31;border-radius:999px;padding:5px 8px;margin-top:5px}
</style>

<script src="./zxing-browser.min.js" defer></script>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🛒</div><div><h1>Preço Certo</h1><div class="sub">Histórico de preços inteligente</div><div class="offlinePill">● Modo offline</div></div><button class="settingsBtn" onclick="openSettings()" aria-label="Configurações">⚙</button></div></header>

<main>
<section id="home" class="screen active">
<div class="hero"><div class="label">Total das compras no mês</div><div class="total" id="monthTotal">R$ 0,00</div><div class="between"><span id="monthName"></span><span id="monthVariation"></span></div></div>
<div class="between"><h2 style="margin:0">Estabelecimentos</h2><button class="secondary small" onclick="openStore()">+ Adicionar</button></div>
<div id="stores" class="mt"></div>
</section>

<section id="storeScreen" class="screen">
<div class="between"><button class="secondary small" onclick="show('home')">← Voltar</button><strong id="storeTitle"></strong><button class="secondary small" onclick="openAddProduct()">＋</button></div><button class="primary mt" onclick="openScanner()">▥ Escanear código de barras</button>
<div class="tabs mt"><button class="tab active" onclick="storeTab('list',this)">Lista de compras</button><button class="tab" onclick="storeTab('history',this)">Histórico</button></div>
<div id="storeList"></div>
</section>

<section id="history" class="screen">
<h2 style="margin-top:0">Histórico de preços</h2>
<div id="historyList"></div>
</section>

<section id="reports" class="screen">
<h2 style="margin-top:0">Relatórios</h2>
<div class="card"><h3>Resumo do mês</h3><div id="report"></div></div>
</section>
</main>

<nav class="bottom">
<button class="nav active" onclick="show('home');nav(this)">⌂<br>Painel</button>
<button class="nav" onclick="show('history');nav(this)">◷<br>Histórico</button>
<button class="scanBtn" onclick="openScanner()">▥</button>
<button class="nav" onclick="show('reports');nav(this)">▤<br>Relatórios</button>
<button class="nav" onclick="openStore()">＋<br>Loja</button>
</nav>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='precoCertoOfflineV1';
const THEME_KEY='precoCertoThemeV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{stores:[],products:[]};
let currentStore=null, currentMonth=new Date().toISOString().slice(0,7);
let scannerBusy=false, currentCameraStream=null, scanLoopId=null, zxingControls=null;

const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function monthLabel(m){let [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}
function normalizeName(n){return n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function stopCamera(){
  scannerBusy=false;
  if(zxingControls){try{zxingControls.stop();}catch(e){} zxingControls=null;}
  if(scanLoopId){cancelAnimationFrame(scanLoopId);scanLoopId=null;}
  if(currentCameraStream){currentCameraStream.getTracks().forEach(t=>t.stop());currentCameraStream=null;}
}
function show(id){
  stopCamera();
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='home')renderHome();
  if(id==='history')renderHistory();
  if(id==='reports')renderReport();
}
function nav(el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function openModal(content){document.getElementById('sheet').innerHTML=content;document.getElementById('modal').classList.add('show')}
function closeModal(){stopCamera();document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function getTheme(){
  return JSON.parse(localStorage.getItem(THEME_KEY)||'null')||{name:'Verde',a:'#20e36b',b:'#0fa653'};
}
function applyTheme(t=getTheme()){
  document.documentElement.style.setProperty('--accent',t.a);
  document.documentElement.style.setProperty('--accent2',t.b);
  document.documentElement.style.setProperty('--green',t.a);
  document.documentElement.style.setProperty('--green2',t.b);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=t.a;
}
function setTheme(name,a,b){localStorage.setItem(THEME_KEY,JSON.stringify({name,a,b}));applyTheme({name,a,b});closeModal();renderHome();}
function openSettings(){
  const t=getTheme();
  openModal(`<h2>⚙ Personalização</h2>
    <div class="muted">Cor atual: <b>${esc(t.name)}</b>. A escolha fica salva neste aparelho.</div>
    <div class="colorGrid">
      <button class="colorChoice" style="background:#20e36b" onclick="setTheme('Verde','#20e36b','#0fa653')">Verde</button>
      <button class="colorChoice" style="background:#2788ff" onclick="setTheme('Azul','#2788ff','#1558c9')">Azul</button>
      <button class="colorChoice" style="background:#a855f7" onclick="setTheme('Roxo','#a855f7','#7132b3')">Roxo</button>
      <button class="colorChoice" style="background:#ff8a24" onclick="setTheme('Laranja','#ff8a24','#c55a08')">Laranja</button>
      <button class="colorChoice" style="background:#ff4d63" onclick="setTheme('Vermelho','#ff4d63','#b82437')">Vermelho</button>
      <button class="colorChoice" style="background:#16c8cf" onclick="setTheme('Ciano','#16c8cf','#0b858a')">Ciano</button>
    </div>
    <button class="secondary mt" style="width:100%" onclick="closeModal()">Fechar</button>`);
}

function renderHome(){
  let total=db.products.filter(p=>p.month===currentMonth).reduce((s,p)=>s+p.price,0);
  document.getElementById('monthTotal').textContent=brl(total);
  document.getElementById('monthName').textContent=monthLabel(currentMonth);
  let el=document.getElementById('stores'); el.innerHTML='';
  if(!db.stores.length){
    el.innerHTML='<div class="empty">Nenhum estabelecimento cadastrado.<br><br>Adicione seu primeiro mercado, açougue ou feira.</div>';
    return;
  }
  db.stores.forEach(s=>{
    let ps=db.products.filter(p=>p.storeId===s.id&&p.month===currentMonth);
    let t=ps.reduce((a,p)=>a+p.price,0);
    el.innerHTML+=`<div class="card store" onclick="openStore(${s.id})">
      <div class="storeIcon">${s.icon||'🏪'}</div>
      <div class="storeInfo"><div class="storeName">${esc(s.name)}</div><div class="muted">${ps.length} produto(s)</div></div>
      <strong>${brl(t)}</strong>
      <button class="iconBtn" onclick="event.stopPropagation();deleteStore(${s.id})" title="Apagar mercado">🗑</button>
    </div>`;
  });
}
function openStore(id){
  if(id){
    currentStore=db.stores.find(s=>s.id===id);
    if(!currentStore)return;
    show('storeScreen');
    document.getElementById('storeTitle').textContent=currentStore.name;
    renderStoreList();
    return;
  }
  openModal(`<h2>Novo estabelecimento</h2>
    <input id="sname" placeholder="Ex.: Mercado Central">
    <div class="row mt">
      <button class="secondary" onclick="createStore('🛒')">🛒 Mercado</button>
      <button class="secondary" onclick="createStore('🥩')">🥩 Açougue</button>
      <button class="secondary" onclick="createStore('🥦')">🥦 Feira</button>
    </div>
    <button class="primary mt" onclick="createStore('🏪')">Criar estabelecimento</button>
    <button class="secondary mt" style="width:100%" onclick="closeModal()">Cancelar</button>`);
}
function createStore(icon){
  let name=document.getElementById('sname').value.trim();
  if(!name)return alert('Digite o nome do estabelecimento.');
  let s={id:Date.now(),name,icon}; db.stores.push(s); save(); closeModal(); openStore(s.id);
}
function deleteStore(id){
  const s=db.stores.find(x=>x.id===id); if(!s)return;
  if(!confirm(`Apagar "${s.name}" e todo o histórico de produtos desse estabelecimento?`))return;
  db.stores=db.stores.filter(x=>x.id!==id);
  db.products=db.products.filter(p=>p.storeId!==id);
  if(currentStore?.id===id)currentStore=null;
  save(); renderHome();
}

function renderStoreList(){
  let ps=db.products.filter(p=>p.storeId===currentStore.id&&p.month===currentMonth);
  let el=document.getElementById('storeList');
  if(!ps.length){
    el.innerHTML='<div class="empty">Nenhum produto neste mês.<br><br>Use ＋ para adicionar ou escaneie um código.</div>';
    return;
  }
  el.innerHTML=`<div class="card">
    <div class="muted">Marque os produtos. O total muda na hora.</div>
    ${ps.map(p=>productHTML(p)).join('')}
    <div class="selectedBox">
      <div class="between"><span>Selecionados</span><strong id="selectedCount">0</strong></div>
      <div class="between mt"><span>Total da compra</span><strong id="selectedTotal">${brl(0)}</strong></div>
    </div>
  </div>`;
  document.querySelectorAll('.check').forEach(c=>c.addEventListener('change',selectedTotal));
}
function productHTML(p){
  let all=db.products.filter(x=>x.productKey===p.productKey&&x.storeId===p.storeId).sort((a,b)=>a.month.localeCompare(b.month));
  let prev=all.filter(x=>x.month<p.month).pop(), diff=prev?((p.price-prev.price)/prev.price*100):0;
  let varHTML=prev?(diff>0?`<span class="up">↑ ${diff.toFixed(1)}%</span>`:diff<0?`<span class="down">↓ ${Math.abs(diff).toFixed(1)}%</span>`:'<span class="same">0%</span>'):'<span class="same">novo</span>';
  return `<div class="product">
    <input class="check" type="checkbox" data-price="${p.price}">
    <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="muted">Anterior: ${prev?brl(prev.price):'—'} · ${varHTML}</div></div>
    <div class="price">${brl(p.price)}</div>
    <button class="iconBtn" onclick="deleteProduct('${encodeURIComponent(p.productKey)}',${p.storeId})" title="Apagar produto">🗑</button>
  </div>`;
}
function selectedTotal(){
  let checked=[...document.querySelectorAll('.check:checked')];
  let t=checked.reduce((s,e)=>s+Number(e.dataset.price),0);
  let total=document.getElementById('selectedTotal'), count=document.getElementById('selectedCount');
  if(total) total.textContent=brl(t);
  if(count) count.textContent=checked.length;
}
function deleteProduct(encodedKey,storeId){
  const key=decodeURIComponent(encodedKey);
  const p=db.products.find(x=>x.productKey===key&&x.storeId===storeId);
  if(!p)return;
  if(!confirm(`Apagar "${p.name}" e todo o histórico desse produto neste estabelecimento?`))return;
  db.products=db.products.filter(x=>!(x.productKey===key&&x.storeId===storeId));
  save();
  if(currentStore?.id===storeId)renderStoreList(); else renderHome();
}
function storeTab(type,btn){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  if(type==='history')renderStoreHistory(); else renderStoreList();
}
function renderStoreHistory(){
  let ps=db.products.filter(p=>p.storeId===currentStore.id).sort((a,b)=>b.month.localeCompare(a.month));
  document.getElementById('storeList').innerHTML=ps.length?'<div class="card">'+ps.map(p=>`<div class="product"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="muted">${monthLabel(p.month)}</div></div><strong>${brl(p.price)}</strong></div>`).join('')+'</div>':'<div class="empty">Sem histórico.</div>';
}

function openAddProduct(prefill='',code=''){
  if(!currentStore){chooseStore('add');return;}
  openModal(`<h2>Adicionar produto</h2>
    <input id="pname" placeholder="Nome do produto" value="${esc(prefill)}">
    <input id="pprice" class="mt" type="number" step="0.01" min="0" placeholder="Preço (R$)">
    <input id="pcode" class="mt" placeholder="Código de barras (opcional)" value="${esc(code)}">
    <input id="pmonth" class="mt" type="month" value="${currentMonth}">
    <button class="primary mt" onclick="addProduct()">Salvar produto</button>
    <button class="secondary mt" style="width:100%" onclick="closeModal()">Cancelar</button>`);
}
function addProduct(){
  let name=document.getElementById('pname').value.trim(),
      price=Number(document.getElementById('pprice').value),
      code=document.getElementById('pcode').value.trim(),
      month=document.getElementById('pmonth').value;
  if(!name||!price||!month)return alert('Preencha produto, preço e mês.');
  let key=code||normalizeName(name);
  const sameMonth=db.products.find(x=>x.storeId===currentStore.id&&x.productKey===key&&x.month===month);
  if(sameMonth){sameMonth.name=name;sameMonth.price=price;sameMonth.code=code;}
  else db.products.push({id:Date.now(),storeId:currentStore.id,name,price,code,month,productKey:key});
  save(); closeModal(); renderStoreList();
}

function chooseStore(action='scan'){
  if(!db.stores.length){openStore();return;}
  openModal(`<h2>Escolha o estabelecimento</h2>
    <div class="muted">Os preços ficam separados por mercado.</div>
    <div class="mt">${db.stores.map(s=>`<button class="secondary" style="width:100%;margin-bottom:8px" onclick="selectStoreAndContinue(${s.id},'${action}')">${s.icon||'🏪'} ${esc(s.name)}</button>`).join('')}</div>
    <button class="secondary" style="width:100%" onclick="closeModal()">Cancelar</button>`);
}
function selectStoreAndContinue(id,action){
  currentStore=db.stores.find(s=>s.id===id); closeModal();
  if(action==='scan')openScanner(); else openAddProduct();
}

async function openScanner(){
  if(!currentStore){chooseStore('scan');return;}
  scannerBusy=false;
  openModal(`<h2>📷 Escanear produto</h2>
    <div class="camera"><video id="video" autoplay muted playsinline></video><div class="frame"></div>
      <div id="cammsg" style="position:absolute;bottom:10px;z-index:3;font-size:12px;background:#000b;padding:7px 11px;border-radius:9px">Iniciando câmera...</div>
    </div>
    <div class="muted">Ao reconhecer o código, o app avança sozinho.</div>
    <input id="manualCode" class="mt" inputmode="numeric" placeholder="Ou digite o código">
    <button class="secondary mt" style="width:100%" onclick="manualDetectedCode()">Usar código digitado</button>
    <button class="secondary mt" style="width:100%" onclick="closeModal()">Fechar</button>`);
  await requestCamera();
}
async function requestCamera(){
  const msg=document.getElementById('cammsg');
  const v=document.getElementById('video');
  if(!v)return;

  // 1) Preferência: ZXing salvo dentro do próprio app (100% offline).
  if(window.ZXingBrowser && ZXingBrowser.BrowserMultiFormatReader){
    try{
      if(msg)msg.textContent='Leitor offline ZXing ativo — aponte para o código.';
      const reader=new ZXingBrowser.BrowserMultiFormatReader();
      zxingControls=await reader.decodeFromConstraints(
        {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},
        v,
        (result,error,controls)=>{
          if(result && !scannerBusy){
            scannerBusy=true;
            if(navigator.vibrate)navigator.vibrate(120);
            try{controls.stop();}catch(e){}
            handleDetectedCode(result.getText ? result.getText() : String(result.text||result));
          }
        }
      );
      return;
    }catch(e){
      console.log('Falha no ZXing local, tentando leitor nativo:',e);
    }
  }

  // 2) Fallback offline: BarcodeDetector nativo do Android/Chrome/WebView.
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('camera-api');
    currentCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=currentCameraStream; await v.play();
    if(msg)msg.textContent='Câmera ativa — aponte para o código.';
    if('BarcodeDetector' in window){
      let detector;
      try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});}
      catch(e){detector=new BarcodeDetector();}
      const scan=async()=>{
        if(scannerBusy||!document.getElementById('video'))return;
        try{
          const codes=await detector.detect(v);
          if(codes.length){
            scannerBusy=true;
            if(navigator.vibrate)navigator.vibrate(120);
            handleDetectedCode(codes[0].rawValue);
            return;
          }
        }catch(e){}
        scanLoopId=requestAnimationFrame(scan);
      };
      scan();
    }else{
      if(msg)msg.textContent='⚠️ Leitor ZXing local não encontrado. Use o campo de código até adicionar zxing-browser.min.js ao pacote.';
    }
  }catch(e){
    if(msg)msg.textContent='❌ Não consegui abrir a câmera. Verifique a permissão CAMERA do APK.';
  }
}
function manualDetectedCode(){
  const input=document.getElementById('manualCode');
  const code=input?.value.trim();
  if(!code)return alert('Digite o código.');
  handleDetectedCode(code);
}
function handleDetectedCode(code){
  if(!code)return;
  stopCamera();
  const inStore=db.products.filter(p=>p.storeId===currentStore.id&&p.code===code).sort((a,b)=>a.month.localeCompare(b.month));
  const existing=inStore[inStore.length-1];
  if(existing){
    showExistingScannedProduct(existing,code);
    return;
  }
  const anywhere=db.products.filter(p=>p.code===code).sort((a,b)=>a.month.localeCompare(b.month)).pop();
  closeModal();
  openAddProduct(anywhere?.name||'',code);
}
function showExistingScannedProduct(existing,code){
  const history=db.products.filter(p=>p.storeId===currentStore.id&&p.productKey===existing.productKey).sort((a,b)=>a.month.localeCompare(b.month));
  openModal(`<h2>✅ Produto encontrado</h2>
    <div class="scanFound">
      <div class="muted">${esc(currentStore.name)}</div>
      <div style="font-size:20px;font-weight:800;margin:4px 0">${esc(existing.name)}</div>
      <div class="between"><span>Último valor</span><strong>${brl(existing.price)}</strong></div>
      <div class="muted mt">Último registro: ${monthLabel(existing.month)} · Código ${esc(code)}</div>
    </div>
    <label class="muted">Valor atual</label>
    <input id="scanNewPrice" class="mt" type="number" step="0.01" min="0" placeholder="R$ 0,00">
    <button class="primary mt" onclick="confirmScannedPrice('${encodeURIComponent(existing.productKey)}','${encodeURIComponent(code)}')">Usar valor atual</button>
    <button class="secondary mt" style="width:100%" onclick="closeModal()">Não alterar agora</button>`);
}
function confirmScannedPrice(encodedKey,encodedCode){
  const key=decodeURIComponent(encodedKey), code=decodeURIComponent(encodedCode);
  const latest=db.products.filter(p=>p.storeId===currentStore.id&&p.productKey===key).sort((a,b)=>a.month.localeCompare(b.month)).pop();
  const value=Number(document.getElementById('scanNewPrice').value);
  if(!value)return alert('Digite o valor atual.');
  const diff=value-latest.price;
  const pct=latest.price?Math.abs(diff/latest.price*100):0;
  const status=diff>0?`mais caro (+${pct.toFixed(1)}%)`:diff<0?`mais barato (-${pct.toFixed(1)}%)`:'com o mesmo preço';
  if(!confirm(`Valor antigo: ${brl(latest.price)}\nValor atual: ${brl(value)}\n\nEstá ${status}.\nDeseja registrar o novo valor?`))return;
  const current=db.products.find(p=>p.storeId===currentStore.id&&p.productKey===key&&p.month===currentMonth);
  if(current){current.price=value;current.code=code;current.name=latest.name;}
  else db.products.push({id:Date.now(),storeId:currentStore.id,name:latest.name,price:value,code,month:currentMonth,productKey:key});
  save(); closeModal(); show('storeScreen'); document.getElementById('storeTitle').textContent=currentStore.name; renderStoreList();
}

function renderHistory(){
  let groups={}; db.products.forEach(p=>(groups[p.storeId+'|'+p.productKey]??=[]).push(p));
  let el=document.getElementById('historyList'), arr=Object.values(groups).sort((a,b)=>a[0].name.localeCompare(b[0].name));
  el.innerHTML=arr.length?arr.map(g=>{
    g.sort((a,b)=>a.month.localeCompare(b.month));
    let p=g[g.length-1], prev=g[g.length-2], diff=prev?((p.price-prev.price)/prev.price*100):0;
    return `<div class="card"><div class="between"><strong>${esc(p.name)}</strong><strong>${brl(p.price)}</strong></div>
      <div class="muted">${esc(db.stores.find(s=>s.id===p.storeId)?.name||'')} · ${monthLabel(p.month)}</div>
      <div class="mt">${prev?(diff>0?`🔴 ↑ ${diff.toFixed(1)}% mais caro`:diff<0?`🟢 ↓ ${Math.abs(diff).toFixed(1)}% mais barato`:'⚪ Mesmo preço'):'Primeiro registro'}</div>
    </div>`;
  }).join(''):'<div class="empty">Seu histórico aparecerá aqui.</div>';
}
function renderReport(){
  let months={}; db.products.forEach(p=>months[p.month]=(months[p.month]||0)+p.price);
  let rows=Object.entries(months).sort().reverse();
  document.getElementById('report').innerHTML=rows.length?rows.map((r,i)=>{
    let prev=rows[i+1], d=prev?(r[1]-prev[1])/prev[1]*100:0;
    return `<div class="between" style="padding:10px 0;border-bottom:1px solid #29322d"><span>${monthLabel(r[0])}</span><strong>${brl(r[1])} ${prev?(d>0?'🔴 ↑':'🟢 ↓'):''}</strong></div>`;
  }).join(''):'Nenhuma compra registrada ainda.';
}

function renderStoreList(){
 let ps=db.products.filter(p=>p.storeId===currentStore.id&&p.month===currentMonth);

 if(!ps.length){el.innerHTML='<div class="empty">Nenhum produto neste mês.<br><br>Use ＋ para adicionar ou escaneie um código.</div>';return}

function productHTML(p){
 let all=db.products.filter(x=>x.productKey===p.productKey&&x.storeId===p.storeId).sort((a,b)=>a.month.localeCompare(b.month));
 let prev=all.filter(x=>x.month<currentMonth).pop(), diff=prev?((p.price-prev.price)/prev.price*100):0;
 let varHTML=prev?(diff>0?`<span class="up">↑ ${diff.toFixed(1)}%</span>`:diff<0?`<span class="down">↓ ${Math.abs(diff).toFixed(1)}%</span>`:'<span class="same">0%</span>'):'<span class="same">novo</span>';
 return `<div class="product"><input class="check" type="checkbox" data-price="${p.price}"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="muted">Último: ${prev?brl(prev.price):'—'} · ${varHTML}</div></div><div class="price">${brl(p.price)}</div></div>`
}

 openModal(`<h2>Adicionar produto</h2><input id="pname" placeholder="Nome do produto" value="${esc(prefill)}"><input id="pprice" class="mt" type="number" step="0.01" min="0" placeholder="Preço (R$)"><input id="pcode" class="mt" placeholder="Código de barras (opcional)"><input id="pmonth" class="mt" type="month" value="${currentMonth}"><button class="primary mt" onclick="addProduct()">Salvar produto</button><button class="secondary mt" style="width:100%" onclick="closeModal()">Cancelar</button>`)

function addProduct(){let name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value),code=document.getElementById('pcode').value.trim(),month=document.getElementById('pmonth').value;if(!name||!price||!month)return alert('Preencha produto, preço e mês.');let key=code||name.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');db.products.push({id:Date.now(),storeId:currentStore.id,name,price,code,month,productKey:key});save();closeModal();renderStoreList()}
async function openScanner(){
 openModal(`<h2>▥ Escanear produto</h2>
 <div class="camera">
   <video id="video" autoplay muted playsinline></video>
   <div class="frame"></div>
   <div id="cammsg" style="position:absolute;bottom:10px;z-index:3;font-size:12px;background:#000b;padding:7px 11px;border-radius:9px">Toque em “Permitir câmera” para começar.</div>
 </div>
 <div class="card" style="margin:0 0 10px;padding:12px;background:#0d1510;border-color:#1d3d29">
   <div style="font-weight:700">📷 Acesso à câmera</div>
   <div class="muted mt">O navegador vai mostrar a janela de permissão. Escolha <b>Permitir</b>.</div>
 </div>
 <input id="manualCode" class="mt" placeholder="Ou digite o código de barras">
 <button class="primary mt" onclick="requestCamera()">📷 Permitir câmera</button>
 <button class="secondary mt" style="width:100%" onclick="lookupCode()">Usar código digitado</button>
 <button class="secondary mt" style="width:100%" onclick="closeModal()">Fechar</button>`);
}
async function requestCamera(){
 const msg=document.getElementById('cammsg');
 try{
   if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
     throw new Error('unsupported');
   }
   if(msg) msg.textContent='Solicitando permissão...';
   const stream=await navigator.mediaDevices.getUserMedia({
     video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
     audio:false
   });
   const v=document.getElementById('video');
   if(!v){stream.getTracks().forEach(t=>t.stop());return}
   v.srcObject=stream;
   await v.play();
   window.currentCameraStream=stream;
   if(msg) msg.textContent='Câmera ativa — aponte para o código de barras.';

   if('BarcodeDetector' in window){
     let detector;
     try{
       detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
     }catch(e){ detector=new BarcodeDetector(); }
     const scan=async()=>{
       if(!document.getElementById('video')){
         stream.getTracks().forEach(t=>t.stop());
         return;
       }
       try{
         const codes=await detector.detect(v);
         if(codes.length){
           const code=codes[0].rawValue;
           const input=document.getElementById('manualCode');
           if(input) input.value=code;
           if(msg) msg.textContent='✓ Código detectado: '+code;
           if(navigator.vibrate) navigator.vibrate(100);
         }
       }catch(e){}
       requestAnimationFrame(scan);
     };
     scan();
   }else{
     // Fallback via ZXing for browsers without BarcodeDetector.
     if(msg) msg.textContent='Ativando leitor compatível...';
     if(!window.ZXingBrowser){
       await new Promise((resolve,reject)=>{
         const s=document.createElement('script');
         s.src='https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js';
         s.onload=resolve; s.onerror=reject;
         document.head.appendChild(s);
       });
     }
     const reader=new ZXingBrowser.BrowserMultiFormatReader();
     window.zxingReader=reader;
     const devices=await reader.listVideoInputDevices();
     const deviceId=(devices.find(d=>/back|environment|traseira/i.test(d.label))||devices[devices.length-1])?.deviceId;
     await reader.decodeFromVideoDevice(deviceId,v,(result)=>{
       if(result){
         const code=result.getText();
         const input=document.getElementById('manualCode');
         if(input) input.value=code;
         if(msg) msg.textContent='✓ Código detectado: '+code;
         if(navigator.vibrate) navigator.vibrate(100);
       }
     });
   }
 }catch(e){
   if(msg){
     if(location.protocol==='file:' || location.protocol==='content:'){
       msg.textContent='⚠️ Este HTML foi aberto como arquivo. Para a câmera funcionar, abra em HTTPS ou no APK.';
     }else if(e.name==='NotAllowedError'){
       msg.textContent='⚠️ Permissão negada. Libere a câmera nas configurações do navegador.';
     }else{
       msg.textContent='⚠️ Não foi possível abrir a câmera. Tente novamente.';
     }
   }
 }
}

}
